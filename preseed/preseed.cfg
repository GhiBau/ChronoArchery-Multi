## preseed.cfg — installation Debian automatisée pour un poste ChronoArchery
## (écran ou maître) sur un vieux PC/portable.
##
## Usage : voir README.md, section « Installer sur un vieux PC portable ».
## En résumé : démarrer l'installeur Debian (netinst) et, sur l'écran de
## démarrage, ajouter le paramètre de boot :
##   auto=true priority=critical preseed/url=http://<adresse>/preseed.cfg
## en hébergeant ce fichier sur un serveur HTTP temporaire accessible depuis
## la machine en cours d'installation (ex. python3 -m http.server sur un
## autre ordinateur du même réseau).
##
## Ce fichier ne fait QUE répondre aux questions habituelles de l'installeur
## (langue, disque, mot de passe...) et déclenche à la toute fin
## scripts/install.sh — voir la variable CHRONO_SOURCE_URL plus bas, à
## adapter selon que vous testez en local ou installez depuis un dépôt
## publié.

### Localisation
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr(oss)

### Réseau
# DHCP sur la première interface filaire trouvée : c'est le réseau normal de
# l'INSTALLATION (avec accès Internet), sans rapport avec le réseau fermé
# ChronoArchery créé plus tard par l'agent au premier démarrage.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string chronoarchery-poste
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

### Miroir Debian
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Horloge
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

### Compte utilisateur
# Le poste tourne en kiosque sous root (voir systemd/chronoarchery-kiosk.service) :
# on désactive le compte root interactif au profit d'un compte d'entretien
# nommé, pour ne pas laisser le mot de passe root par défaut de l'installeur.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Entretien ChronoArchery
d-i passwd/username string chrono
# Mot de passe temporaire À CHANGER après l'installation (passwd chrono) —
# préseeder un mot de passe en clair n'est raisonnable que parce que ce
# fichier ne doit jamais être publié tel quel avec un vrai mot de passe.
d-i passwd/user-password password chrono-a-changer
d-i passwd/user-password-again password chrono-a-changer
d-i user-setup/allow-password-weak boolean true

### Partitionnement
# Disque entier, schéma simple (pas de LVM) : suffisant pour un poste dédié
# à un seul usage, et plus simple à dépanner sur du vieux matériel.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Paquets
# Aucun environnement de bureau : scripts/install.sh installe lui-même
# exactement ce dont le kiosque a besoin (Xorg minimal + Chromium), pas une
# tâche desktop complète.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server curl ca-certificates sudo
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### Chargeur de démarrage
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Fin d'installation
d-i finish-install/reboot_in_progress note

### Déploiement ChronoArchery — late_command
# Exécuté juste avant la fin de l'installation, DANS le système fraîchement
# installé (in-target), pendant qu'il a encore l'accès réseau de
# l'installateur. Voir scripts/install.sh pour le détail.
d-i preseed/late_command string \
  in-target sh -c ' \
    CHRONO_SOURCE_URL="__A_REMPLACER__"; \
    if [ "$CHRONO_SOURCE_URL" = "__A_REMPLACER__" ]; then \
      echo "ChronoArchery : CHRONO_SOURCE_URL non renseigné dans preseed.cfg — installation NON faite automatiquement." > /etc/chronoarchery-todo.txt; \
      echo "Connectez-vous (utilisateur chrono) et lancez : sudo bash install.sh --source-dir <chemin>" >> /etc/chronoarchery-todo.txt; \
    else \
      mkdir -p /root/chronoarchery-src && \
      curl --max-time 60 -fsSL "$CHRONO_SOURCE_URL" -o /tmp/chrono-src.tar.gz && \
      tar xzf /tmp/chrono-src.tar.gz -C /root/chronoarchery-src --strip-components=1 && \
      bash /root/chronoarchery-src/scripts/install.sh --source-dir /root/chronoarchery-src \
        || echo "ChronoArchery : échec de l'installation automatique, voir /var/log/syslog. Relancer à la main : sudo bash /root/chronoarchery-src/scripts/install.sh --source-dir /root/chronoarchery-src" > /etc/chronoarchery-todo.txt; \
    fi \
  '
